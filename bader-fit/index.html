:root{font-family:'DM Sans',Arial,sans-serif;color:#f2efe8;background:#101311;--ink:#101311;--surface:#1c211e;--line:#353c36;--cream:#f1efe6;--orange:#ff7848;--lime:#c4ed76}

/* FORM ONE: progression, consistency and quick nutrition */
function foDateOffset(key,offset){const d=new Date(key+'T12:00:00');d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function foConsistency(){
 const completed=new Set(Object.keys(data.workouts||{}).filter(k=>data.workouts[k]?.done));
 const isRest=k=>new Date(k+'T12:00:00').getDay()===6;
 let cursor=day,streak=0;
 for(let i=0;i<365;i++){
   if(isRest(cursor)){cursor=foDateOffset(cursor,-1);continue}
   if(completed.has(cursor)){streak++;cursor=foDateOffset(cursor,-1);continue}
   if(cursor===day){cursor=foDateOffset(cursor,-1);continue}
   break;
 }
 const dates=Array.from({length:7},(_,i)=>foDateOffset(day,i-6));
 const eligible=dates.filter(k=>k<day&&!isRest(k)||(k===day&&completed.has(k)&&!isRest(k)));
 const finished=eligible.filter(k=>completed.has(k)).length;
 const percent=eligible.length?Math.round(finished/eligible.length*100):null;
 const total=completed.size;
 return '<div class="card fo-consistency"><div class="fo-section-line"><span class="fo-icon-disc">✦</span><div><span class="section-kicker">CONSISTENCY</span><h2>Show up. Repeat.</h2></div></div><div class="fo-kpi-pair"><div><small>TRAINING STREAK</small><strong>'+streak+'</strong><span>planned sessions in a row</span></div><div><small>LAST 7 DAYS</small><strong>'+(percent===null?'—':percent+'%')+'</strong><span>'+finished+' of '+eligible.length+' finished days</span></div></div><div class="fo-week-dots">'+dates.map(k=>{let rest=isRest(k),done=completed.has(k),future=k>day,now=k===day;return '<div title="'+k+'" class="'+(rest?'rest':done?'done':now?'current':future?'future':'missed')+'"><span>'+new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'narrow'})+'</span><b>'+(done?'✓':rest?'☾':now?'○':future?'·':'−')+'</b></div>'}).join('')+'</div><p class="muted">'+total+' completed sessions recorded. Recovery Saturdays are neutral. Today is not marked missed before it ends.</p></div>'
}
function foWeeklyComparison(){const sum=(end)=>Array.from({length:7},(_,i)=>healthRows[foDateOffset(end,i-6)]).reduce((v,x)=>({steps:v.steps+(Number(x?.steps)||0),kcal:v.kcal+(Number(x?.active_calories)||0),minutes:v.minutes+(Number(x?.exercise_minutes)||0)}),{steps:0,kcal:0,minutes:0});const a=sum(day),b=sum(foDateOffset(day,-7));const row=(label,x,y,unit)=>'<div class="row" style="padding:10px 0;border-bottom:1px solid #dce8de"><b>'+label+'</b><span>'+Math.round(x).toLocaleString()+' '+unit+' <small>('+(!y?'no prior baseline':((x-y)/y>=0?'+':'')+Math.round((x-y)/y*100)+'%')+')</small></span></div>';return '<div class="card"><span class="section-kicker">THIS WEEK VS LAST WEEK</span><h2>WEEKLY COMPARISON</h2>'+row('Steps',a.steps,b.steps,'')+row('Active calories',a.kcal,b.kcal,'kcal')+row('Exercise',a.minutes,b.minutes,'min')+'<p class="muted">Uses available synced daily totals; missing days are not estimated.</p></div>'}
function foOverload(){
 const ex=current()?.ex||[];
 const entries=ex.map(e=>{
  const sessions=Object.entries(data.workouts||{}).filter(([k,v])=>k<day&&Array.isArray(v?.sets?.[e.n])&&v.sets[e.n].length).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!sessions.length)return null;
  const sets=sessions[0][1].sets[e.n],last=sets.at(-1);
  const numbers=String(e.r||e.reps||'').match(/\d+/g)||[];
  const target=numbers.length?Number(numbers[numbers.length-1]):0;
  const allWeighted=sets.every(x=>Number(x.weight)>0);
  const canIncrease=target>0&&allWeighted&&sets.length>=e.s&&sets.every(x=>Number(x.reps)>=target);
  return {name:e.n,date:sessions[0][0],reps:last.reps,weight:last.weight,canIncrease,bodyweight:!allWeighted};
 }).filter(Boolean);
 return '<div class="card fo-strength"><span class="section-kicker">STRENGTH HISTORY</span><h2>Progressive overload</h2>'+(entries.length?entries.map(x=>'<div class="fo-history-row"><b>'+esc(x.name)+'</b><span>'+Number(x.weight||0)+' kg · '+Number(x.reps||0)+' reps</span><small>'+(x.canIncrease?'Upper rep target reached across all prescribed weighted sets. Consider a small increase if form was solid.':x.bodyweight?'Track controlled reps and technique.':'Build toward the top of your rep range.')+'</small></div>').join(''):'<p class="muted">Record sets to see load progression.</p>')+'</div>';
}

function foExerciseCompare(name){const past=Object.entries(data.workouts||{}).filter(([date,record])=>date<day&&Array.isArray(record?.sets?.[name])&&record.sets[name].length).sort((a,b)=>b[0].localeCompare(a[0]));const todaySets=w().sets[name]||[];const summary=sets=>({sets:sets.length,volume:sets.reduce((a,x)=>a+(Number(x.weight)||0)*(Number(x.reps)||0),0),best:sets.reduce((a,x)=>Math.max(a,Number(x.weight)||0),0),reps:sets.reduce((a,x)=>a+(Number(x.reps)||0),0)});if(!past.length)return '<div class="card"><span class="section-kicker">PREVIOUS PERFORMANCE</span><h2>FIRST RECORDED SESSION</h2><p class="muted">Once you log this movement on another date, your previous sets and today’s changes will appear here automatically.</p></div>';const previous=past[0][1].sets[name],a=summary(todaySets),b=summary(previous);const delta=(v,w,unit)=>todaySets.length?'<small style="color:'+(v>=w?'#50bc88':'#ff9b79')+'">'+(v>=w?'+':'')+Math.round((v-w)*100)/100+' '+unit+' vs last session</small>':'<small>Log a set to compare</small>';return '<div class="card"><span class="section-kicker">YOUR LAST SESSION / '+past[0][0]+'</span><h2>BEAT YOUR PREVIOUS WORKOUT</h2><div class="grid"><div><small>PREVIOUS BEST WEIGHT</small><h2>'+b.best+' kg</h2></div><div><small>TODAY BEST WEIGHT</small><h2>'+a.best+' kg</h2>'+delta(a.best,b.best,'kg')+'</div><div><small>PREVIOUS VOLUME</small><h2>'+Math.round(b.volume)+' kg</h2></div><div><small>TODAY VOLUME</small><h2>'+Math.round(a.volume)+' kg</h2>'+delta(a.volume,b.volume,'kg')+'</div></div><h3>LAST SESSION SETS</h3>'+previous.map((x,i)=>'<div class="row" style="padding:8px 0;border-bottom:1px solid #415247"><b>Set '+(i+1)+'</b><span>'+Number(x.weight||0)+' kg × '+Number(x.reps||0)+' reps</span></div>').join('')+'<p class="muted">Volume = logged weight × repetitions. Compare only the same movement and equipment; cable stack loads may not equal free-weight resistance.</p></div>'}

/* Three distinct warm notification sounds, synthesized locally (no downloads). */
const foSfxStorage='form-one-sound-preferences';
let foAudioCtx=null,foAudioUnlocked=false,foRingChimeAt=0;
function foSfxPrefs(){try{const x=JSON.parse(localStorage.getItem(foSfxStorage)||'{}');return {enabled:x.enabled!==false,level:Math.max(0,Math.min(1,Number.isFinite(Number(x.level))?Number(x.level):.5))}}catch{return {enabled:true,level:.5}}}
function foSfxSave(key,value){const prefs=foSfxPrefs();prefs[key]=value;localStorage.setItem(foSfxStorage,JSON.stringify(prefs));render()}
function foUnlockAudio(){
 if(!foSfxPrefs().enabled)return null;
 const AudioCtor=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtor)return null;
 try{
  if(!foAudioCtx)foAudioCtx=new AudioCtor();
  if(foAudioCtx.state!=='running')foAudioCtx.resume().catch(()=>{});
  foAudioUnlocked=foAudioCtx.state==='running';
  return foAudioCtx
 }catch{return null}
}
function foPlaySound(type){
 const p=foSfxPrefs();
 if(!p.enabled||!p.level||document.visibilityState==='hidden')return;
 const ctx=foAudioCtx||foUnlockAudio();if(!ctx)return;
 if(ctx.state!=='running'){ctx.resume().then(()=>foPlaySound(type)).catch(()=>{});return}
 const patterns={
  timer:[[659.25,0,.19],[830.61,.16,.24],[987.77,.38,.36]],
  session:[[392,0,.25],[523.25,.18,.27],[659.25,.38,.29],[783.99,.59,.34],[1046.5,.83,.66]],
  ring:[[783.99,0,.17],[987.77,.15,.22],[1174.66,.34,.46]],
  set:[[880,0,.16],[1108.73,.16,.23]]
 };
 const seq=patterns[type]||patterns.timer;
 const now=ctx.currentTime+.015;
 seq.forEach(([hz,delay,length],i)=>{
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(hz,now+delay);
  const peak=Math.min(.17,(type==='session'?.09:.077)*(p.level+.15));
  gain.gain.setValueAtTime(.0001,now+delay);
  gain.gain.exponentialRampToValueAtTime(peak,now+delay+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,now+delay+length);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(now+delay);osc.stop(now+delay+length+.04);
  if(type==='session'){
   const harmonic=ctx.createOscillator(),hgain=ctx.createGain();
   harmonic.type='triangle';harmonic.frequency.setValueAtTime(hz*2,now+delay);
   hgain.gain.setValueAtTime(.0001,now+delay);
   hgain.gain.exponentialRampToValueAtTime(peak*.13,now+delay+.02);
   hgain.gain.exponentialRampToValueAtTime(.0001,now+delay+length*.8);
   harmonic.connect(hgain);hgain.connect(ctx.destination);
   harmonic.start(now+delay);harmonic.stop(now+delay+length+.03)
  }
 })
}
