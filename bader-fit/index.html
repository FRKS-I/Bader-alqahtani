/* Feature upgrades: existing Apple Watch data, optional sleep journal, compact nutrition. */
function foWatchInsights(){const rows=(window.formOneWorkoutHR||[]).filter(x=>Number.isFinite(Number(x.average_bpm))&&x.started_at&&x.ended_at).sort((a,b)=>new Date(b.started_at)-new Date(a.started_at));if(!rows.length)return '<div class="card fo-watch"><h2>⌚ Watch insights</h2><p class="muted">Your next synced workout will show a heart-rate comparison here.</p></div>';const last=rows[0],prev=rows[1],bpm=Math.round(Number(last.average_bpm)),duration=Math.max(0,Math.round((new Date(last.ended_at)-new Date(last.started_at))/60000));const diff=prev?bpm-Math.round(Number(prev.average_bpm)):null;return '<div class="card fo-watch"><span class="section-kicker">APPLE WATCH · WORKOUT ANALYSIS</span><h2>⌚ Last workout</h2><div class="fo-kpi-pair"><div><small>AVERAGE HEART RATE</small><strong>'+bpm+'</strong><span>BPM</span></div><div><small>RECORDED INTERVAL</small><strong>'+duration+'</strong><span>minutes</span></div></div>'+(prev?'<p class="fo-insight">Average HR '+(diff===0?'unchanged':Math.abs(diff)+' BPM '+(diff>0?'higher':'lower'))+' than your previous recorded session ('+Math.round(Number(prev.average_bpm))+' BPM).</p>':'<p class="muted">More sessions will unlock comparisons.</p>')+'<p class="muted">An average BPM alone cannot measure heart-rate zones, training quality or recovery. Duration is the synced interval, not a verified Apple Workout duration.</p></div>'}
function foSleepCard(){const rows=data.sleepJournal||{},entry=rows[day]||{},all=Object.entries(rows).filter(([k,v])=>k<=day&&Number(v.hours)>0).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);const avg=all.length?(all.reduce((a,[,v])=>a+Number(v.hours),0)/all.length).toFixed(1):'—';return '<div class="card fo-sleep"><span class="section-kicker">SLEEP & RECOVERY</span><h2>☾ Sleep journal</h2><div class="fo-kpi-pair"><div><small>RECENT AVERAGE</small><strong>'+avg+'</strong><span>hours · '+all.length+' entries</span></div><div><small>TODAY</small><strong>'+(entry.hours||'—')+'</strong><span>hours recorded</span></div></div><div class="grid"><label>Sleep hours<input id="fo-sleep-hours" type="number" min="0" max="24" step="0.25" value="'+esc(entry.hours||'')+'" placeholder="e.g. 7.5"></label><label>How rested?<select id="fo-sleep-feel"><option value="">Choose</option>'+[['low','Tired'],['okay','Okay'],['good','Rested']].map(([k,v])=>'<option value="'+k+'" '+(entry.feel===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label></div><button onclick="foSaveSleep()">Save sleep</button><p class="muted">Manual log for now. Apple Health sleep stages and automatic recovery analysis require an additional iPhone sync step; no recovery score is invented.</p></div>'}
function foSaveSleep(){const h=Number(document.getElementById('fo-sleep-hours')?.value),feel=document.getElementById('fo-sleep-feel')?.value||'';if(!Number.isFinite(h)||h<=0||h>24){notice('Enter sleep hours between 0 and 24');return}data.sleepJournal??={};data.sleepJournal[day]={hours:h,feel};save();render();notice('Sleep saved')}
function foNutritionSummary(){const total={cal:0,protein:0,carbs:0,fat:0};(n().meals||[]).forEach(m=>Object.keys(total).forEach(k=>total[k]+=Number(m[k])||0));return '<div class="card fo-fuel-summary"><span class="section-kicker">TODAY AT A GLANCE</span><h2>Fuel balance</h2><div class="fo-fuel-grid">'+[['cal','Calories','kcal'],['protein','Protein','g'],['carbs','Carbs','g'],['fat','Fat','g']].map(([k,label,unit])=>{const goal=Number(data.goals[k])||0,used=Math.round(total[k]),left=Math.max(0,Math.round(goal-total[k])),pct=goal?Math.min(100,used/goal*100):0;return '<div class="fo-fuel-metric"><small>'+label+'</small><strong>'+left+' <span>'+unit+' left</span></strong><div class="fo-meter"><i style="width:'+pct+'%"></i></div><small>'+used+' / '+goal+' '+unit+'</small></div>'}).join('')+'</div></div>'}
const foProgressFeatures=progress;progress=function(){return foProgressFeatures()+foWatchInsights()+foSleepCard()};

/* Animated feedback tied to actual saved workout actions. */
function foBurst(large=false){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const wrap=document.createElement('div');wrap.className='fo-celebrate';wrap.setAttribute('aria-hidden','true');
 const colors=['#b5ee83','#ffad75','#83d9e5','#a7a3ff','#f5e59c'];
 for(let i=0;i<(large?44:16);i++){const el=document.createElement('i');const angle=Math.PI*2*i/(large?44:16);const distance=(large?125:75)+Math.random()*(large?170:90);el.style.setProperty('--dx',Math.cos(angle)*distance+'px');el.style.setProperty('--dy',Math.sin(angle)*distance+'px');el.style.setProperty('--spin',(Math.random()*900-450)+'deg');el.style.setProperty('--confetti',colors[i%colors.length]);el.style.animationDelay=(Math.random()*.16)+'s';wrap.appendChild(el)}
 document.body.appendChild(wrap);setTimeout(()=>wrap.remove(),1700)
}
function foFeedback(message){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelector('.fo-set-feedback')?.remove();const el=document.createElement('div');el.className='fo-set-feedback';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),1400)}
