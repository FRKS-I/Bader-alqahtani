(m,n)=>'<div class="card"><div class="row"><div class="exercise-title"><span class="sticker">'+iconFor(n)+'</span><b>'+n+'</b></div>');return html};const oldExercise=exercise;exercise=function(){return oldExercise().replace('<h1>'+esc(current().ex[ix]?.n)+'</h1>','<h1><span class="sticker">'+iconFor(current().ex[ix]?.n||'')+'</span>'+esc(current().ex[ix]?.n)+'</h1>')};render();restore().then(render).catch(e=>notice('Connection issue: '+e.message));</script></html>
